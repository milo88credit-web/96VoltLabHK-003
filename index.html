  <style>

    /* ==========================================
       RESET
    =========================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    /* ==========================================
       BODY
    =========================================== */

    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      color: #ffffff;

      background:

        radial-gradient(
          circle at 50% -5%,
          rgba(187, 143, 48, 0.18) 0%,
          rgba(84, 62, 18, 0.07) 32%,
          transparent 58%
        ),

        radial-gradient(
          circle at 10% 85%,
          rgba(203, 157, 58, 0.04),
          transparent 35%
        ),

        linear-gradient(
          180deg,
          #14120e 0%,
          #0b0a08 50%,
          #050504 100%
        );

      overflow-x: hidden;
    }


    /* ==========================================
       PAGE
    =========================================== */

    .page {

      width: 100%;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(24px, env(safe-area-inset-top))
        14px
        max(24px, env(safe-area-inset-bottom));
    }


    /* ==========================================
       CARD
    =========================================== */

    .card {

      position: relative;

      width: 100%;
      max-width: 390px;

      padding:
        54px
        27px
        40px;

      text-align: center;

      border-radius: 30px;

      border:
        1px solid rgba(211, 168, 73, 0.36);

      background:

        radial-gradient(
          circle at 50% 5%,
          rgba(193, 147, 48, 0.10),
          transparent 38%
        ),

        linear-gradient(
          180deg,
          rgba(26, 23, 17, 0.99) 0%,
          rgba(17, 15, 11, 0.99) 48%,
          rgba(10, 9, 7, 0.99) 100%
        );

      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(205, 159, 56, 0.05),
        inset 0 1px 0 rgba(255, 235, 177, 0.05);

      overflow: hidden;
    }


    /* ==========================================
       TOP GOLD GLOW
    =========================================== */

    .card::before {

      content: "";

      position: absolute;

      width: 370px;
      height: 290px;

      left: 50%;
      top: -185px;

      transform: translateX(-50%);

      background:
        radial-gradient(
          circle,
          rgba(209, 163, 60, 0.17),
          transparent 68%
        );

      pointer-events: none;
    }


    /* ==========================================
       TITLE
    =========================================== */

    .offer-title {

      position: relative;
      z-index: 2;

      color: #fffaf0;

      font-size: 39px;
      line-height: 1.15;

      font-weight: 900;

      letter-spacing: 3px;

      text-shadow:
        0 3px 14px rgba(0, 0, 0, 0.48),
        0 0 18px rgba(218, 174, 73, 0.06);
    }


    /* ==========================================
       TITLE LINE
    =========================================== */

    .title-line {

      width: 64%;
      height: 1px;

      margin:
        20px
        auto
        25px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(224, 184, 91, 0.78),
          rgba(255, 221, 138, 0.65),
          transparent
        );

      box-shadow:
        0 0 10px rgba(212, 167, 65, 0.28);
    }


    /* ==========================================
       OFFER AREA
    =========================================== */

    .offer {

      position: relative;

      width: 100%;
    }


    /* ==========================================
       888%
    =========================================== */

    .offer-number {

      position: relative;
      z-index: 2;

      display: inline-block;

      font-size:
        clamp(90px, 27vw, 116px);

      line-height: 0.92;

      font-weight: 900;

      letter-spacing: -6px;

      white-space: nowrap;

      background:
        linear-gradient(
          180deg,
          #fff8d7 0%,
          #f6db8a 18%,
          #d9ad48 48%,
          #b77d1f 73%,
          #8f5d12 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;

      filter:
        drop-shadow(
          0 4px 0 rgba(77, 49, 4, 0.18)
        )
        drop-shadow(
          0 0 14px rgba(226, 181, 70, 0.25)
        )
        drop-shadow(
          0 0 25px rgba(207, 151, 42, 0.08)
        );
    }


    /* ==========================================
       GOLD UNDERLINE
    =========================================== */

    .offer::after {

      content: "";

      position: absolute;

      width: 88%;
      height: 1px;

      left: 6%;
      bottom: 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(219, 170, 61, 0.90),
          rgba(255, 224, 139, 0.78),
          transparent
        );

      box-shadow:
        0 0 13px rgba(209, 161, 55, 0.38);
    }


    /* ==========================================
       GOLD SPARKS
    =========================================== */

    .spark {

      position: absolute;
      z-index: 3;

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #fff1b0;

      box-shadow:
        0 0 6px #ffe494,
        0 0 15px rgba(230, 183, 70, 0.75);
    }


    .spark.one {
      left: 7%;
      top: 4%;
    }


    .spark.two {

      right: 5%;
      bottom: 4%;

      background: #ffedb3;
    }


    .spark.three {

      left: 50%;
      bottom: -2%;

      background: #fff7d4;
    }


    /* ==========================================
       GOLD DIVIDER
    =========================================== */

    .gold-divider {

      width: 55%;
      height: 1px;

      margin:
        27px
        auto
        0;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(220, 176, 74, 0.38),
          transparent
        );
    }


    /* ==========================================
       DESCRIPTION
    =========================================== */

    .description {

      margin-top: 32px;

      color: #cfc9bb;

      font-size: 15px;
      line-height: 1.8;

      font-weight: 400;

      letter-spacing: 0.2px;
    }


    .description strong {

      color: #e6bf61;

      font-weight: 800;

      text-shadow:
        0 0 10px rgba(218, 170, 59, 0.12);
    }


    /* ==========================================
       SMALL GOLD DIVIDER
    =========================================== */

    .divider {

      position: relative;

      width: 82px;
      height: 1px;

      margin:
        30px
        auto
        26px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(215, 170, 67, 0.25),
          transparent
        );
    }


    .divider::after {

      content: "";

      position: absolute;

      width: 29px;
      height: 3px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          #b9872c,
          #f0cd73
        );

      box-shadow:
        0 0 10px rgba(215, 169, 66, 0.55),
        0 0 20px rgba(221, 174, 65, 0.15);
    }


    /* ==========================================
       QUESTION + HAND
    =========================================== */

    .question {

      margin-bottom: 22px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      color: #ffffff;

      font-size: 18px;
      line-height: 1.4;

      font-weight: 800;

      letter-spacing: 0.4px;

      white-space: nowrap;
    }


    .question-pointer {

      display: inline-block;

      font-size: 34px;
      line-height: 1;

      transform-origin: center;

      filter:
        drop-shadow(
          0 3px 4px rgba(0, 0, 0, 0.45)
        )
        drop-shadow(
          0 0 7px rgba(222, 177, 70, 0.16)
        );

      animation:
        pointDown
        1.3s
        ease-in-out
        infinite;
    }


    @keyframes pointDown {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(7px);
      }
    }


    /* ==========================================
       BUTTON GROUP
    =========================================== */

    .buttons {

      display: flex;

      flex-direction: column;

      gap: 14px;
    }


    .cta {

      width: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      text-decoration: none;

      -webkit-tap-highlight-color: transparent;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        filter 0.18s ease;
    }


    .cta:active {
      transform: scale(0.985);
    }


    /* ==========================================
       MAIN CTA
    =========================================== */

    .primary {

      min-height: 72px;

      gap: 14px;

      border-radius: 17px;

      color: #211704;

      font-size: 20px;

      font-weight: 900;

      background:
        linear-gradient(
          135deg,
          #fff0ad 0%,
          #e6c367 26%,
          #c99734 61%,
          #aa741e 100%
        );

      border:
        1px solid rgba(255, 234, 168, 0.82);

      box-shadow:
        0 13px 32px rgba(190, 139, 37, 0.28),
        0 0 26px rgba(229, 184, 75, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);

      text-shadow:
        0 1px 0 rgba(255, 247, 209, 0.30);
    }


    .primary:hover {

      filter: brightness(1.07);

      box-shadow:
        0 16px 38px rgba(190, 139, 37, 0.34),
        0 0 33px rgba(229, 184, 75, 0.19),
        inset 0 1px 0 rgba(255, 255, 255, 0.60);
    }


    .arrow {

      font-size: 22px;
      line-height: 1;
    }


    /* ==========================================
       WHATSAPP BUTTON
    =========================================== */

    .whatsapp {

      min-height: 63px;

      gap: 10px;

      border-radius: 17px;

      color: #dfbb62;

      font-size: 17px;

      font-weight: 800;

      border:
        1px solid rgba(207, 162, 60, 0.55);

      background:
        linear-gradient(
          180deg,
          rgba(31, 27, 19, 0.82),
          rgba(18, 16, 12, 0.92)
        );

      box-shadow:
        inset 0 1px 0 rgba(255, 235, 174, 0.05),
        0 0 18px rgba(196, 145, 39, 0.04);
    }


    .whatsapp:hover {

      background:
        linear-gradient(
          180deg,
          rgba(43, 36, 23, 0.90),
          rgba(24, 20, 14, 0.97)
        );
    }


    /* ==========================================
       WHATSAPP ICON
    =========================================== */

    .whatsapp-icon {

      width: 23px;
      height: 23px;

      display: inline-flex;

      align-items: center;
      justify-content: center;
    }


    .whatsapp-icon svg {

      width: 100%;
      height: 100%;

      fill: currentColor;
    }


    /* ==========================================
       SMALL MOBILE
    =========================================== */

    @media (max-width: 360px) {

      .page {

        padding-left: 10px;
        padding-right: 10px;
      }


      .card {

        padding:
          49px
          21px
          34px;
      }


      .offer-title {
        font-size: 34px;
      }


      .offer-number {
        font-size: 84px;
      }


      .description {
        font-size: 14px;
      }


      .question {

        font-size: 16px;
        gap: 5px;
      }


      .question-pointer {
        font-size: 30px;
      }


      .primary {

        min-height: 67px;
        font-size: 18px;
      }


      .whatsapp {

        min-height: 59px;
        font-size: 16px;
      }
    }


    /* ==========================================
       DESKTOP
    =========================================== */

    @media (min-width: 768px) {

      .card {

        max-width: 580px;

        padding:
          68px
          58px
          52px;
      }


      .offer-title {
        font-size: 53px;
      }


      .offer-number {
        font-size: 150px;
      }


      .description {
        font-size: 18px;
      }


      .question {

        font-size: 21px;
        gap: 10px;
      }


      .question-pointer {
        font-size: 38px;
      }


      .primary {

        min-height: 78px;
        font-size: 21px;
      }


      .whatsapp {

        min-height: 68px;
        font-size: 18px;
      }
    }


    /* ==========================================
       REDUCED MOTION
    =========================================== */

    @media (prefers-reduced-motion: reduce) {

      .question-pointer {
        animation: none;
      }
    }

  </style>

</head>
