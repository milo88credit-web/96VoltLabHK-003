<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>新人專屬禮遇</title>

  <meta
    name="description"
    content="註冊即拎，免費領取你嘅新人禮遇。"
  >

  <meta property="og:type" content="website">
  <meta property="og:title" content="新人專屬禮遇">

  <meta
    property="og:description"
    content="註冊即拎，免費領取你嘅新人禮遇。"
  >

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(197, 153, 63, 0.12) 0%,
          rgba(197, 153, 63, 0.035) 30%,
          transparent 55%
        ),
        linear-gradient(
          180deg,
          #11100d 0%,
          #080806 52%,
          #030303 100%
        );

      overflow-x: hidden;
    }


    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(28px, env(safe-area-inset-top))
        16px
        max(28px, env(safe-area-inset-bottom));
    }


    /* =========================
       CARD
    ========================= */

    .card {
      position: relative;

      width: 100%;
      max-width: 390px;

      padding:
        62px
        27px
        40px;

      text-align: center;

      border-radius: 30px;

      border:
        1px solid rgba(223, 184, 91, 0.28);

      background:
        radial-gradient(
          circle at 50% 5%,
          rgba(207, 164, 70, 0.09),
          transparent 36%
        ),
        linear-gradient(
          180deg,
          rgba(20, 19, 15, 0.99) 0%,
          rgba(10, 10, 8, 0.99) 100%
        );

      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.48),
        inset 0 1px 0 rgba(255, 240, 190, 0.05);

      overflow: hidden;
    }


    /* =========================
       TOP GLOW
    ========================= */

    .card::before {
      content: "";

      position: absolute;

      width: 330px;
      height: 260px;

      left: 50%;
      top: -180px;

      transform: translateX(-50%);

      background:
        radial-gradient(
          circle,
          rgba(222, 178, 79, 0.17),
          transparent 70%
        );

      pointer-events: none;
    }


    /* =========================
       新人禮遇
    ========================= */

    .offer-title {
      position: relative;
      z-index: 2;

      color: #f8f4e9;

      font-size: 39px;
      line-height: 1.15;

      font-weight: 900;

      letter-spacing: 3px;

      text-shadow:
        0 3px 12px rgba(0, 0, 0, 0.35);
    }


    /* =========================
       888%
    ========================= */

    .offer {
      position: relative;

      width: 100%;

      margin-top: 25px;
    }

    .offer-number {
      position: relative;
      z-index: 2;

      display: inline-block;

      /*
        888% 比 250% 視覺上稍闊，
        所以稍微控制最大尺寸，
        避免手機版 % 被切掉。
      */

      font-size: clamp(84px, 25vw, 108px);

      line-height: 0.92;

      font-weight: 900;

      letter-spacing: -6px;

      white-space: nowrap;

      background:
        linear-gradient(
          180deg,
          #fff4c4 0%,
          #f5d77e 28%,
          #d7a941 65%,
          #a97922 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;

      filter:
        drop-shadow(
          0 3px 0 rgba(76, 48, 5, 0.14)
        )
        drop-shadow(
          0 0 15px rgba(226, 181, 74, 0.15)
        );
    }


    /* =========================
       GOLD UNDERLINE
    ========================= */

    .offer::after {
      content: "";

      position: absolute;

      width: 82%;
      height: 1px;

      left: 9%;
      bottom: 3px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(237, 198, 100, 0.72),
          transparent
        );

      box-shadow:
        0 0 12px rgba(218, 169, 64, 0.28);
    }


    /* =========================
       GOLD SPARKS
    ========================= */

    .spark {
      position: absolute;
      z-index: 3;

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #fff1ad;

      box-shadow:
        0 0 7px #ffe79a,
        0 0 16px rgba(231, 185, 75, 0.65);
    }

    .spark.one {
      left: 8%;
      top: 2%;
    }

    .spark.two {
      right: 7%;
      bottom: 4%;
    }

    .spark.three {
      left: 49%;
      bottom: -2%;
    }


    /* =========================
       GOLD DIVIDER
    ========================= */

    .gold-divider {
      width: 58%;
      max-width: 230px;

      height: 1px;

      margin: 26px auto 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(220, 175, 77, 0.56),
          transparent
        );
    }


    /* =========================
       DESCRIPTION
    ========================= */

    .description {
      margin-top: 34px;

      color: #bcb8ae;

      font-size: 15px;
      line-height: 1.8;

      font-weight: 400;

      letter-spacing: 0.2px;
    }

    .description strong {
      color: #e6c46f;

      font-weight: 800;
    }


    /* =========================
       SMALL DIVIDER
    ========================= */

    .divider {
      position: relative;

      width: 72px;
      height: 1px;

      margin:
        31px
        auto
        26px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(221, 179, 84, 0.35),
          transparent
        );
    }

    .divider::after {
      content: "";

      position: absolute;

      width: 25px;
      height: 2px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      background: #dcb35d;

      box-shadow:
        0 0 9px rgba(226, 182, 83, 0.5);
    }


    /* =========================
       QUESTION + POINTER
    ========================= */

    .question {
      margin-bottom: 21px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      color: #f8f5ed;

      font-size: 18px;
      line-height: 1.4;

      font-weight: 800;

      letter-spacing: 0.4px;

      white-space: nowrap;
    }

    .question-pointer {
      display: inline-block;

      font-size: 32px;
      line-height: 1;

      transform-origin: center;

      filter:
        drop-shadow(
          0 3px 5px rgba(0, 0, 0, 0.4)
        )
        drop-shadow(
          0 0 6px rgba(230, 183, 77, 0.18)
        );

      animation:
        pointDown 1.35s ease-in-out infinite;
    }

    @keyframes pointDown {

      0%,
      100% {
        transform: translateY(1px);
      }

      50% {
        transform: translateY(7px);
      }

    }


    /* =========================
       BUTTON GROUP
    ========================= */

    .buttons {
      display: flex;

      flex-direction: column;

      gap: 14px;
    }

    .cta {
      width: 100%;

      min-height: 70px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 16px;

      text-decoration: none;

      font-size: 19px;
      font-weight: 800;

      -webkit-tap-highlight-color: transparent;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .cta:active {
      transform: scale(0.985);
    }


    /* =========================
       MAIN CTA
    ========================= */

    .primary {
      gap: 13px;

      color: #151006;

      background:
        linear-gradient(
          135deg,
          #fff0ad 0%,
          #e9c263 38%,
          #d5a640 68%,
          #bd892b 100%
        );

      border:
        1px solid rgba(255, 232, 159, 0.68);

      box-shadow:
        0 13px 32px rgba(201, 154, 50, 0.24),
        0 0 24px rgba(255, 213, 111, 0.11),
        inset 0 1px 0 rgba(255, 255, 255, 0.48);
    }

    .primary:hover {
      box-shadow:
        0 16px 38px rgba(201, 154, 50, 0.31),
        0 0 29px rgba(255, 213, 111, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.52);
    }

    .arrow {
      font-size: 22px;
      line-height: 1;
    }


    /* =========================
       WHATSAPP
    ========================= */

    .whatsapp {
      min-height: 62px;

      gap: 10px;

      color: #dfc172;

      font-size: 17px;

      border:
        1px solid rgba(215, 174, 78, 0.54);

      background:
        linear-gradient(
          180deg,
          rgba(30, 27, 19, 0.76),
          rgba(13, 13, 10, 0.82)
        );

      box-shadow:
        inset 0 1px 0
        rgba(255, 241, 190, 0.035);
    }

    .whatsapp:hover {
      background:
        linear-gradient(
          180deg,
          rgba(40, 34, 20, 0.82),
          rgba(18, 16, 11, 0.88)
        );
    }


    /* =========================
       WHATSAPP ICON
    ========================= */

    .whatsapp-icon {
      width: 22px;
      height: 22px;

      display: inline-flex;

      align-items: center;
      justify-content: center;
    }

    .whatsapp-icon svg {
      width: 100%;
      height: 100%;

      fill: currentColor;
    }


    /* =========================
       SMALL MOBILE
    ========================= */

    @media (max-width: 360px) {

      .page {
        padding-left: 11px;
        padding-right: 11px;
      }

      .card {
        padding:
          54px
          21px
          34px;
      }

      .offer-title {
        font-size: 34px;
      }

      .offer-number {
        font-size: 79px;
        letter-spacing: -5px;
      }

      .description {
        font-size: 14px;
      }

      .question {
        font-size: 16px;
        gap: 5px;
      }

      .question-pointer {
        font-size: 29px;
      }

      .cta {
        min-height: 66px;

        font-size: 18px;
      }

      .whatsapp {
        min-height: 59px;

        font-size: 16px;
      }

    }


    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 768px) {

      .card {
        max-width: 580px;

        padding:
          74px
          58px
          50px;
      }

      .offer-title {
        font-size: 52px;
      }

      .offer-number {
        font-size: 142px;
      }

      .description {
        font-size: 18px;
      }

      .question {
        font-size: 21px;

        gap: 9px;
      }

      .question-pointer {
        font-size: 36px;
      }

      .cta {
        min-height: 74px;

        font-size: 20px;
      }

      .whatsapp {
        min-height: 66px;

        font-size: 18px;
      }

    }


    /* =========================
       REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      .question-pointer {
        animation: none;
      }

    }

  </style>

</head>


<body>

  <main class="page">

    <section class="card">


      <!-- 新人禮遇 -->

      <h1 class="offer-title">
        新人禮遇
      </h1>


      <!-- 888% -->

      <div class="offer">

        <span class="spark one"></span>

        <span class="spark two"></span>

        <span class="spark three"></span>


        <div class="offer-number">

      <div class="gold-divider"></div>

      <div class="description">

      <div class="question">

        </span>

      <!-- BUTTONS -->

      <div class="buttons">


        <!-- MAIN CTA -->

        <a
          class="cta primary"

        >

          <span>
            立即加入
          </span>

          <span class="arrow">
            →
          </span>

        </a>


        <!-- WHATSAPP -->

        <a
          class="cta whatsapp"
          href="https://t.ly/tvdaO"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="whatsapp-icon">

            <svg
              viewBox="0 0 32 32"

            >

            </svg>

          </span>

          <span>

          </span>

        </a>


      </div>

    </section>

  </main>

</body>
</html>
